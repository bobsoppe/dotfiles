# AeroSpace config — Standard Dvorak.
# Guide: https://nikitabobko.github.io/AeroSpace/guide.html

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows monitor focus.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

# Translates qwerty letter notation in TOML to dvorak physical key positions.
[key-mapping]
preset = 'dvorak'

[gaps]
inner.horizontal = 4
inner.vertical = 4
outer.left = 4
outer.bottom = 4
outer.top = 4
outer.right = 4

[mode.main.binding]

# Layout
ctrl-slash = 'layout tiles horizontal vertical'
ctrl-comma = 'layout accordion horizontal vertical'

# Focus
ctrl-left  = 'focus left'
ctrl-down  = 'focus down'
ctrl-up    = 'focus up'
ctrl-right = 'focus right'

# Move window
ctrl-shift-left  = 'move left'
ctrl-shift-down  = 'move down'
ctrl-shift-up    = 'move up'
ctrl-shift-right = 'move right'

# Switch workspace
ctrl-1 = 'workspace 1'
ctrl-2 = 'workspace 2'
ctrl-3 = 'workspace 3'
ctrl-4 = 'workspace 4'
ctrl-5 = 'workspace 5'
ctrl-6 = 'workspace 6'
ctrl-7 = 'workspace 7'
ctrl-8 = 'workspace 8'
ctrl-9 = 'workspace 9'
ctrl-0 = 'workspace 10'

# Move window to workspace
ctrl-shift-1 = 'move-node-to-workspace 1'
ctrl-shift-2 = 'move-node-to-workspace 2'
ctrl-shift-3 = 'move-node-to-workspace 3'
ctrl-shift-4 = 'move-node-to-workspace 4'
ctrl-shift-5 = 'move-node-to-workspace 5'
ctrl-shift-6 = 'move-node-to-workspace 6'
ctrl-shift-7 = 'move-node-to-workspace 7'
ctrl-shift-8 = 'move-node-to-workspace 8'
ctrl-shift-9 = 'move-node-to-workspace 9'
ctrl-shift-0 = 'move-node-to-workspace 10'

alt-tab = 'workspace-back-and-forth'
alt-shift-enter = 'mode service'

[mode.service.binding]
esc = 'mode main'
r = ['flatten-workspace-tree', 'mode main']           # dvorak: p
f = ['layout floating tiling', 'mode main']           # dvorak: y
backspace = ['close-all-windows-but-current', 'mode main']

# Ensure Homebrew binaries are on PATH for AeroSpace exec-and-forget callbacks.
[exec]
inherit-env-vars = true

[exec.env-vars]
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

# ====================================================================
# Workspace → app auto-placement.
# Apps with native macOS tabs (issue #68) use 'layout floating' so each
# tab-window doesn't reserve dead tile space:
#   https://github.com/nikitabobko/AeroSpace/issues/68
# Workspace map: 2=Ghostty, 3=Zed, 4=Safari, 5=Reeder, 6=WhatsApp, 7=Mail.
# ====================================================================

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['layout floating', 'move-node-to-workspace 2']

[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = ['move-node-to-workspace 3']

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = ['move-node-to-workspace 4']

[[on-window-detected]]
if.app-id = 'com.reederapp.5.macOS'
run = ['move-node-to-workspace 5']

[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = ['move-node-to-workspace 6']

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = ['move-node-to-workspace 7']
